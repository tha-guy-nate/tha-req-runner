[project]
name = "tha-req-runner"
version = "0.2.5"
description = "A Tabular Helper API library that wraps requests with thread-safe session reuse, automatic retries, and a normalized response dict."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["http", "requests", "api", "retry", "session"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31", "urllib3>=2.0"]

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
dev = ["pytest>=9.1.0", "ruff>=0.15.17", "mypy>=2.1.0", "deptry>=0.25.1", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/tha-guy-nate/tha-req-runner"
Issues = "https://github.com/tha-guy-nate/tha-req-runner/issues"
Changelog = "https://github.com/tha-guy-nate/tha-req-runner/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tha_req_runner"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.deptry]
known_first_party = ["tha_req_runner"]
optional_dependencies_dev_groups = ["dev"]
